{% extends "base.html" %}

{% block content %}
<div style="max-width: 400px; margin: 50px auto;">
    <h2>Cadastro</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div style="padding: 10px; margin-bottom: 10px;" class="{{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form action="{{ url_for('cadastro') }}" method="POST">

        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div>
            <label for="nome">Nome Completo:</label><br>
            <input type="text" id="nome" name="nome" required style="width: 100%; padding: 8px;">
        </div>
        <br>
        <div>
            <label for="email">E-mail:</label><br>
            <input type="email" id="email" name="email" required style="width: 100%; padding: 8px;">
        </div>
        <br>
        <div>
            <label for="senha">Senha:</label><br>
            <input type="password" id="senha" name="senha" required style="width: 100%; padding: 8px;">
        </div>
        <br>
        <button type="submit" style="padding: 10px 20px;">Cadastrar</button>
    </form>
    <p>Já tem uma conta? <a href="{{ url_for('login') }}">Faça Login</a></p>
</div>
{% endblock %}
